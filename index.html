<!doctype html>
<!-- GitHub Pages demo -->
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Поймай искру</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        color: #f7f3ff;
        background: #100b24;
        font: 16px/1.4 system-ui, sans-serif;
      }
      main { width: min(100%, 720px); text-align: center; }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        border: 2px solid #9d7dff;
        border-radius: 18px;
        background: #1b1238;
        touch-action: manipulation;
      }
      p { margin: 12px 0 0; color: #cfc4ec; }
    </style>
  </head>
  <body>
    <main>
      <h1>Поймай искру</h1>
      <canvas id="game" width="720" height="440" aria-label="Игра Поймай искру"></canvas>
      <p>Нажимай на искру. За 20 секунд набери как можно больше очков.</p>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
